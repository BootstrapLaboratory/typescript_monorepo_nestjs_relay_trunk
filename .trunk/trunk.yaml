# This file controls the behavior of Trunk: https://docs.trunk.io/cli
# To learn more about the format of this file, see https://docs.trunk.io/reference/trunk-yaml
version: 0.1
cli:
  version: 1.25.0
# Trunk provides extensibility via plugins. (https://docs.trunk.io/plugins)
plugins:
  sources:
    - id: trunk
      ref: v1.8.0
      uri: https://github.com/trunk-io/plugins
# Many linters and tools depend on runtimes - configure them here. (https://docs.trunk.io/runtimes)
runtimes:
  enabled:
    - go@1.21.0
    - node@22.16.0
    - python@3.14.4
# This is the section where you manage your linters. (https://docs.trunk.io/check/configuration)
lint:
  enabled:
    - actionlint@1.7.12
    - grype@0.112.0
    - oxipng@10.1.1
    - shellcheck@0.11.0
    - shfmt@3.6.0
    - eslint@10.3.0
    - checkov@3.2.526
    - git-diff-check
    - hadolint@2.14.0
    - markdownlint@0.48.0
    - osv-scanner@2.3.6
    - prettier@3.8.3
    - svgo@4.0.1
    - trufflehog@3.95.2
    - yamllint@1.38.0
  ignore:
    - linters: [ALL]
      paths:
        - libs/api/schema.gql
    - linters: [eslint]
      paths:
        # Generated Rush wrappers and legacy deployment script folders are not
        # Rush TypeScript projects. Real app, Labkit, tooling, and deploy
        # Rush projects own package-local ESLint configs.
        - common/scripts/**
        - deploy/cloudflare-pages/**
        - deploy/cloudrun/**
actions:
  disabled:
    - trunk-announce
    - trunk-check-pre-push
    - trunk-fmt-pre-commit
  enabled:
    - trunk-upgrade-available
